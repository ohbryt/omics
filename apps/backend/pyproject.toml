[project]
name = "omics-backend"
version = "0.1.0"
description = "Backend + AI gateway for the AI-assisted omics desktop application"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
openai = ["openai>=1.40"]
anthropic = ["anthropic>=0.34"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["omics_backend*"]
