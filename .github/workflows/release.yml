name: release

# Build the standalone desktop installers (.exe for Windows, .dmg for macOS) on real
# OS runners — they have the symlink / signing-toolchain support the dev sandbox lacks,
# and a .dmg can only be built on macOS. PyInstaller freezes the backend per-OS, then
# electron-builder packages + publishes the installer to the GitHub release for the tag.

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write   # electron-builder publishes release assets

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            ebflags: "--win nsis"
          - os: macos-latest
            ebflags: "--mac dmg"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install backend deps + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install fastapi "uvicorn[standard]" pydantic pyyaml pyinstaller

      - name: Freeze backend (PyInstaller, per-OS)
        run: python -m PyInstaller apps/backend/omics-backend.spec --noconfirm --distpath apps/backend/dist --workpath apps/backend/build

      - name: Sanity-check the frozen backend exists
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then test -f apps/backend/dist/omics-backend/omics-backend.exe; else test -f apps/backend/dist/omics-backend/omics-backend; fi
          echo "backend bundle present"

      - name: Install desktop deps
        working-directory: apps/desktop
        run: npm ci || npm install

      - name: Typecheck
        working-directory: apps/desktop
        run: npm run typecheck

      - name: Build renderer + electron bundles
        working-directory: apps/desktop
        run: npm run build

      - name: Package + publish installer
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"   # unsigned build (no Apple/Win cert in CI)
        run: npx electron-builder ${{ matrix.ebflags }} --publish always

      - name: Upload installer as a workflow artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: omics-desktop-${{ matrix.os }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
          if-no-files-found: warn
