name: ci

on:
  push:
  pull_request:

jobs:
  verify-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend (deps for config + verifier + tests)
        run: |
          python -m pip install --upgrade pip
          pip install pydantic pyyaml fastapi "uvicorn[standard]" httpx pytest
      - name: Validate config.yaml against schema
        env:
          PYTHONPATH: apps/backend
        run: python -m omics_backend.config_model config.yaml
      - name: Verifier blocks the empty-audit template state (expect non-zero)
        env:
          PYTHONPATH: apps/backend
        run: |
          set +e
          python scripts/verify.py
          code=$?
          set -e
          echo "verify exit=$code"
          test "$code" -ne 0   # an unpopulated repo MUST NOT report PASS
      - name: Run test suite (config validation + verifier + Milestone-1 + API)
        env:
          PYTHONPATH: apps/backend
        run: python -m pytest tests/ -q
